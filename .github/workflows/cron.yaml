name: liftwatch cron

on:
  schedule:
    # 05:00–19:00 JST window (UTC conversion)
    - cron: "*/5 20-23 * * *"
    - cron: "*/5 0-10 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call liftwatch cron endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS -f \
            -H "X-Cron-Secret: $CRON_SECRET" \
            "https://liftwatch.vercel.app/api/cron"